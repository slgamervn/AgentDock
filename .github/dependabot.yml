version: 2
updates:
  # GitHub Actions: preserve immutable SHA pinning while tracking upstream releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2

  # Root plugins/wrapper, Android app and Macrobenchmark modules.
  # Group the same dependency across modules into one version-update PR.
  - package-ecosystem: gradle
    directories:
      - /
      - /app
      - /macrobenchmark
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      gradle-module-dependencies:
        applies-to: version-updates
        group-by: dependency-name

  # Runtime and development requirements in backend/requirements*.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
