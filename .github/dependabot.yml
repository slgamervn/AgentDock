version: 2
updates:
  # GitHub Actions: preserve immutable SHA pinning while tracking upstream releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2

  # Android application and Macrobenchmark Gradle build files.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2

  # Runtime and development requirements in backend/requirements*.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
